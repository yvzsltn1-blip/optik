<!doctype html><html lang="tr"><meta charset="utf-8"><title>Optik kayıt ayarları</title><style>body{font:16px system-ui;max-width:750px;margin:40px auto}button{padding:14px;margin:8px}pre{white-space:pre-wrap}</style><h1>Kayıt yapılandırması</h1><p>Proje: optik-form-903ed · Yönetici: elifslymn@gmail.com</p><button id="check">Mevcut yapılandırmayı kontrol et</button><button id="close-signup">Herkese açık kaydı kapat</button><pre id="out" role="status">Hazır</pre><script>
const out=document.querySelector('#out');
async function api(path,options={}){const {token}=await(await fetch('./google-admin-token.json',{cache:'no-store'})).json();const response=await fetch('https://identitytoolkit.googleapis.com/'+path,{...options,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json','x-goog-user-project':'optik-form-903ed'}});const data=await response.json();if(!response.ok)throw Error(JSON.stringify(data.error));return data;}
document.querySelector('#check').onclick=async()=>{try{out.textContent='Kontrol ediliyor…';const config=await api('admin/v2/projects/optik-form-903ed/config');const lookup=await api('v1/projects/optik-form-903ed/accounts:lookup',{method:'POST',body:JSON.stringify({email:['elifslymn@gmail.com']})});const users=(lookup.users||[]).map(u=>({email:u.email,uid:u.localId,disabled:u.disabled||false}));out.textContent=JSON.stringify({subtype:config.subtype,permissions:config.client?.permissions,admin:users},null,2);}catch(e){out.textContent='HATA: '+e.message;}};
document.querySelector('#close-signup').onclick=async()=>{try{out.textContent='Kaydı kapatılıyor…';await api('admin/v2/projects/optik-form-903ed/config?updateMask=client.permissions.disabledUserSignup',{method:'PATCH',body:JSON.stringify({client:{permissions:{disabledUserSignup:true}}})});const data=await api('admin/v2/projects/optik-form-903ed/config');out.textContent=JSON.stringify({permissions:data.client?.permissions},null,2);}catch(e){out.textContent='HATA: '+e.message;}};
</script></html>
