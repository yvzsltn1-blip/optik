<!doctype html>
<meta charset="utf-8">
<title>scan-booklet-e2e</title>
<style>body{margin:0} iframe{width:500px;height:900px;border:0}</style>
<iframe id="f"></iframe>
<script>
// Kitapçıklı sınav (16): dörtlü A6 sayfası, kitapçıklar A, B, B, işaretsiz. Her öğrenci kendi kitapçığının
// anahtarına göre ilk n soruyu doğru yapar. Ardından B işaretli bir anahtar formu okutulur.
const examId = 16;
const f = document.getElementById('f');
f.src = '../app/index.html#/exam/' + examId;
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
// Okuma ayrı iş parçacığında ve eşzamansız: sabit süre yerine koşul beklenir
const until = async (fn, ms = 15000) => { const t = Date.now(); while (!fn() && Date.now() - t < ms) await wait(50); };
const log = [];
f.onload = () => run().catch((e) => (document.title = 'HATA ' + e + ' ' + e.stack));

async function photo(win, d, Layout, exam, cls, forms) {
  const fmt = Layout.fmtOf(exam.format);
  const grid = Layout.grid(fmt, exam.questionCount, exam.optionCount);
  const pos = [[0, 0], [105, 0], [0, 148.5], [105, 148.5]];
  const bs = Layout.bookletSpots(fmt, Layout.bookletCount(exam));
  let marks = '';
  forms.forEach((fm, s) => {
    fm.ans.forEach((a, i) => {
      if (a == null) return;
      const [x, y] = grid.questions[i].opts[a];
      marks += `<ellipse cx="${pos[s][0] + x}" cy="${pos[s][1] + y}" rx="${fmt.grid.r * 0.92}" ry="${fmt.grid.r * 0.84}" fill="#555"/>`;
    });
    if (fm.bk != null) { const [x, y] = bs.opts[fm.bk]; marks += `<ellipse cx="${pos[s][0] + x}" cy="${pos[s][1] + y}" rx="${bs.r * 0.9}" ry="${bs.r * 0.82}" fill="#555"/>`; }
  });
  const svg = Layout.pageSVG(fmt, forms.map((fm) => ({ student: fm.student, exam, cls }))).replace(/<\/svg>$/, marks + '</svg>');
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  await img.decode();
  const c = document.createElement('canvas');
  c.width = 1200; c.height = 1600;
  const x = c.getContext('2d');
  x.fillStyle = '#6b5a48'; x.fillRect(0, 0, c.width, c.height);
  x.translate(600, 800); x.rotate(-0.08); x.drawImage(img, -500, -707, 1000, 1414);
  const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.85));
  const dt = new DataTransfer();
  dt.items.add(new File([blob], 'foto.jpg', { type: 'image/jpeg' }));
  const input = d.getElementById('scan-file');
  input.files = dt.files;
  input.dispatchEvent(new Event('change'));
  await until(() => !d.getElementById("scan-card").hidden || /bulunamadı|okunamadı|değil|kayıtlı/.test(d.getElementById("scan-status").textContent));
}

async function run() {
  const win = f.contentWindow, d = win.document;
  const Store = win.eval('Store'), Layout = win.eval('Layout');
  await wait(300);
  const exam = Store.getExam(examId), cls = Store.getClass(exam.classId);
  const ids = [10, 11, 12, 13], bks = [0, 1, 1, null], ns = [18, 12, 15, 10];
  const forms = ids.map((id, s) => {
    const key = Store.keyFor(exam, bks[s] ?? 0);
    return { student: Store.getStudent(id), bk: bks[s], ans: key.map((k, i) => (i < ns[s] ? k : null)) };
  });
  d.querySelector('[data-act=scan]').click();
  await wait(500);
  await photo(win, d, Layout, exam, cls, forms);
  const card = d.getElementById('scan-card');
  for (let i = 0; i < 4; i++) {
    if (card.hidden) { log.push('KART YOK: ' + d.getElementById('scan-status').textContent); break; }
    log.push(card.innerText.replace(/\s+/g, ' ').replace(/ (Tekrar oku|Kapat) Kaydet$/, ''));
    const before = card.innerText;
    card.querySelector('[data-scan=save]').click();
    await until(() => card.hidden || card.innerText !== before, 5000);
  }
  ids.forEach((id, s) => {
    const r = Store.getResult(examId, id), sc = r && Store.scoreResult(exam, r);
    const ok = r && r.booklet === bks[s] && sc.correct === ns[s] && sc.wrong === 0;
    log.push(`#${id} kitapçık ${r?.booklet} doğru ${sc?.correct}/${ns[s]} yanlış ${sc?.wrong} → ${ok ? 'OK' : 'HATALI'}`);
  });
  d.querySelector('[data-scan=close]').click();
  // Anahtar formu: B kitapçığı işaretli, cevaplar yeni bir B anahtarı
  win.location.hash = '#/exam/' + examId + '/key/1';
  await wait(400);
  d.querySelector('[data-act=scan-key]').click();
  await wait(500);
  const newB = Array.from({ length: 20 }, (_, i) => (i * 3) % 4);
  await photo(win, d, Layout, exam, cls, [{ student: Store.getStudent(2), bk: 1, ans: newB }]);
  log.push('ANAHTAR KARTI: ' + card.innerText.replace(/\s+/g, ' '));
  const primary = card.querySelector('[data-scan=usekey].primary');
  log.push('Önerilen: ' + (primary ? primary.textContent : 'yok'));
  primary.click();
  await wait(300);
  const e2 = Store.getExam(examId);
  log.push('B anahtarı güncellendi: ' + (JSON.stringify(Store.keyFor(e2, 1)) === JSON.stringify(newB) ? 'OK' : 'HATALI') + ' | A anahtarı korundu: ' + (JSON.stringify(Store.keyFor(e2, 0)) === JSON.stringify(exam.key) ? 'OK' : 'HATALI'));
  document.title = log.join(' || ');
}
</script>
